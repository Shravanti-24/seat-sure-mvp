spring:
  application:
    name: seatsure

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seatsure}
    username: ${DATABASE_USERNAME:seatsure}
    password: ${DATABASE_PASSWORD:seatsure}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    dev.seatsure: ${LOG_LEVEL:INFO}

seatsure:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  jwt:
    # Must be at least 32 bytes for HS256. Always set this in production.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-32-bytes-min}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:720}

  hold:
    duration-seconds: ${HOLD_DURATION_SECONDS:420}
    max-seats-per-request: 6
    expiry-job-grace-seconds: 30
    expiry-job-interval-ms: 30000

  ticket:
    hmac-secret: ${TICKET_HMAC_SECRET:dev-only-ticket-hmac-secret-change-me}

  queue:
    batch-size: ${QUEUE_BATCH_SIZE:25}
    tick-interval-ms: ${QUEUE_TICK_INTERVAL_MS:5000}
    admission-ttl-seconds: ${QUEUE_ADMISSION_TTL_SECONDS:600}
    abandon-after-seconds: ${QUEUE_ABANDON_AFTER_SECONDS:60}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: 60
    limits:
      holds: ${RATE_LIMIT_HOLDS:10}
      payments: ${RATE_LIMIT_PAYMENTS:5}
      queue-status: ${RATE_LIMIT_QUEUE_STATUS:30}

  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:admin12345}
    staff-password: ${SEED_STAFF_PASSWORD:gate12345}
    loadtest-password: ${SEED_LOADTEST_PASSWORD:loadtest12345}
    high-demand-sale-delay-minutes: ${HIGH_DEMAND_SALE_DELAY_MINUTES:2}
